framework = arduino
monitor_speed = 9600

lib_deps =
    https://github.com/tzapu/WiFiManager.git  ; <--- THÊM DÒNG NÀY VÀO LÀ CHUẨN ĐẮC Ý
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8